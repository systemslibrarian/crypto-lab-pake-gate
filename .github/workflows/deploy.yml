# Deploy the static Vite build to GitHub Pages.
# Enable once in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
# vite.config.ts uses base "./" so assets resolve under the project subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a main deployment midway through publication.
  cancel-in-progress: false

jobs:
  # The gate itself lives in .github/workflows/browser-gate.yml so that ci.yml's
  # dependabot-auto-merge job can require the very same definition -- `needs:`
  # cannot cross files, but a reusable workflow can be called from both. This job
  # keeps the name `build` so `deploy: needs: build` below is unchanged. The
  # called source-running workflow inherits only this file's contents:read grant;
  # Pages/OIDC write authority exists solely on the no-checkout deploy job.
  build:
    uses: ./.github/workflows/browser-gate.yml
    with:
      upload_pages_artifact: true

  deploy:
    needs: build
    # This workflow has no pull_request trigger, so the condition is true today;
    # it is here so that adding one later cannot start publishing from a pull
    # request. `!= 'pull_request'` and never `== 'push'` -- the latter reads the
    # same and also skips workflow_dispatch, which would disable the
    # post-auto-merge dispatch in ci.yml that is the only reason main deploys at
    # all after a bump merges itself.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
