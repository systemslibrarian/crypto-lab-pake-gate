# Deploy the static Vite build to GitHub Pages.
# Enable once in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
# vite.config.ts uses base "./" so assets resolve under the project subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Must track ci.yml's matrix floor. jsdom 30 does not run on Node 20, and
          # this job's `npm run test` is the same suite -- left at 20 it would drop
          # the three jsdom files without failing, since this job has no coverage
          # floor to catch it, and ship the build anyway.
          node-version: 22
          cache: npm
      - run: npm ci
      # The unit/vector/phase-machine suite must block publishing, not just show up
      # as a separate red check on ci.yml.
      - name: Unit and vector gate
        run: npm run test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser claims and accessibility gate
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
