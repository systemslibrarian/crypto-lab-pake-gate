name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Two Node majors, floor raised 20 -> 22 on 2026-08-21. Node 20 went EOL
        # 2026-04-30 and the toolchain followed: jsdom 30 declares
        # "^22.22.2 || ^24.15.0 || >=26.0.0" and pulls undici 8 (">=22.19.0"),
        # which calls worker_threads.markAsUncloneable -- added in Node 22.10 and
        # never backported. On 20 that throws inside the pool worker, so the three
        # jsdom suites never start; vitest still prints "18 passed" and only the
        # coverage floor notices the missing files. Testing on an EOL runtime that
        # silently drops suites is worth less than testing on 24.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage # runs all tests + enforces the src/pake coverage floor
      - run: npm run build

  # The browser gate the Pages deploy runs, called from the single file that
  # defines it. Before this, auto-merge below was gated on `test` alone while
  # deploy.yml ran the Playwright claims and axe WCAG suite, so a bump that broke
  # only the browser gate passed CI, merged itself, and then failed the deploy on
  # a merge commit with no pull request watching -- main stops shipping and
  # nothing anywhere goes red. crypto-lab-e91 was found serving a stale build in
  # exactly that shape.
  #
  # Pull requests only. On a push to main the identical gate already runs inside
  # deploy.yml, where it actually blocks publishing; a second copy here would
  # gate nothing. Skipping it on push cannot let a bump through, because a
  # skipped `needs:` skips its dependent -- the failure direction is "does not
  # merge".
  browser-gate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-gate.yml

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    # Both gate jobs. deploy.yml's `deploy` needs the same browser-gate
    # definition, and that equality is the whole invariant: nothing can merge
    # itself past a check the deploy will later insist on.
    needs: [test, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
